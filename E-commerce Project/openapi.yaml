openapi: 3.0.3
info:
  title: E-Commerce REST API Engine Specification
  description: |
    Comprehensive OpenAPI specification for the E-Commerce REST API.
    Provides complete REST endpoints for Products, Categories, Orders, Cart, Users, Reviews, Wishlist, Sellers, Coupons, and Admin management.
    Designed for seamless auto-discovery, canonical data integration, AI recommendation SaaS engines, and third-party platform connectors.
  version: 1.0.0
  contact:
    name: E-Commerce API Development Team
    email: Ecommerce.GradProject.2026@gmail.com

servers:
  - url: http://localhost:5250
    description: Development Server (HTTP)
  - url: https://localhost:7087
    description: Development Server (HTTPS)
  - url: https://api.ecommerce-platform.com
    description: Production Deployed Server (Cloud Gateway)

paths:
  # =========================================================================
  # PRODUCTS ENDPOINTS
  # =========================================================================
  /api/Products:
    get:
      tags:
        - Products
      summary: Get list of products with filtering & pagination
      description: Retrieve products catalog with optional filters for search, category, price range, and sorting.
      parameters:
        - name: SearchTerm
          in: query
          required: false
          schema:
            type: string
        - name: CategoryId
          in: query
          required: false
          schema:
            type: integer
        - name: MinPrice
          in: query
          required: false
          schema:
            type: number
            format: decimal
        - name: MaxPrice
          in: query
          required: false
          schema:
            type: number
            format: decimal
        - name: SortBy
          in: query
          required: false
          schema:
            type: string
        - name: PageNumber
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: PageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponseProductList'

    post:
      tags:
        - Products
      summary: Create a new product (Seller / Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductDto'
      responses:
        '200':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponseProduct'

  /api/Products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponseProduct'
        '404':
          description: Product not found

    put:
      tags:
        - Products
      summary: Update existing product (Seller / Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductDto'
      responses:
        '200':
          description: Product updated successfully

    delete:
      tags:
        - Products
      summary: Delete a product (Seller / Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product deleted successfully

  /api/Products/{id}/upload-image:
    post:
      tags:
        - Products
      summary: Upload product image
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded successfully

  /api/Products/my-inventory:
    get:
      tags:
        - Products
      summary: Get seller's product inventory
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Seller products retrieved successfully

  /api/Products/{id}/update-stock:
    patch:
      tags:
        - Products
      summary: Update product stock quantity
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: integer
              description: New stock quantity
      responses:
        '200':
          description: Stock updated successfully

  # =========================================================================
  # CATEGORIES ENDPOINTS
  # =========================================================================
  /api/Categories:
    get:
      tags:
        - Categories
      summary: Get all product categories
      parameters:
        - name: SearchTerm
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Categories list retrieved successfully

    post:
      tags:
        - Categories
      summary: Create new category (Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryDto'
      responses:
        '200':
          description: Category created successfully

  /api/Categories/{id}:
    get:
      tags:
        - Categories
      summary: Get category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category details

    put:
      tags:
        - Categories
      summary: Update category (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryDto'
      responses:
        '200':
          description: Category updated

    delete:
      tags:
        - Categories
      summary: Delete category (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category deleted

  /api/Categories/{id}/upload-image:
    post:
      tags:
        - Categories
      summary: Upload category image (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded

  # =========================================================================
  # AUTHENTICATION ENDPOINTS
  # =========================================================================
  /api/Auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new customer user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '200':
          description: User registered successfully

  /api/Auth/login:
    post:
      tags:
        - Authentication
      summary: Login user and obtain JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful with JWT Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/Auth/confirm-email:
    get:
      tags:
        - Authentication
      summary: Confirm email address with token
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email confirmed successfully

  /api/Auth/register-seller:
    post:
      tags:
        - Authentication
      summary: Register a new seller account (pending admin approval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSellerDto'
      responses:
        '200':
          description: Seller application submitted successfully

  # =========================================================================
  # CART ENDPOINTS
  # =========================================================================
  /api/Cart:
    get:
      tags:
        - Cart
      summary: Get user shopping cart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart details retrieved

  /api/Cart/count:
    get:
      tags:
        - Cart
      summary: Get total count of items in cart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart item count retrieved

  /api/Cart/add-item:
    post:
      tags:
        - Cart
      summary: Add product item to cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartDto'
      responses:
        '200':
          description: Item added to cart

  /api/Cart/update-item:
    put:
      tags:
        - Cart
      summary: Update cart item quantity
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemDto'
      responses:
        '200':
          description: Item quantity updated

  /api/Cart/remove-item/{cartItemId}:
    delete:
      tags:
        - Cart
      summary: Remove single item from cart
      security:
        - BearerAuth: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item removed from cart

  /api/Cart/clear:
    delete:
      tags:
        - Cart
      summary: Clear entire cart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart cleared successfully

  /api/Cart/validate-inventory:
    post:
      tags:
        - Cart
      summary: Validate inventory availability for cart items
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateInventoryDto'
      responses:
        '200':
          description: Inventory validation results

  # =========================================================================
  # CHECKOUT & ORDERS ENDPOINTS
  # =========================================================================
  /api/Checkout/calculate-summary:
    post:
      tags:
        - Checkout & Orders
      summary: Calculate order summary & totals with promo code
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateSummaryDto'
      responses:
        '200':
          description: Calculated order summary

  /api/Checkout/validate-promo:
    post:
      tags:
        - Checkout & Orders
      summary: Validate a promo/coupon code
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatePromoDto'
      responses:
        '200':
          description: Promo code validation outcome

  /api/Checkout/user-checkout:
    post:
      tags:
        - Checkout & Orders
      summary: Place order / complete user checkout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutDto'
      responses:
        '200':
          description: Order placed successfully

  /api/Checkout/order/{orderId}:
    get:
      tags:
        - Checkout & Orders
      summary: Get order details by order ID
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details

  /api/Checkout/my-orders:
    get:
      tags:
        - Checkout & Orders
      summary: Get current authenticated user's order history
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user orders

  /api/Checkout/cancel-order/{orderId}:
    post:
      tags:
        - Checkout & Orders
      summary: Cancel an existing order
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order cancelled successfully

  /api/Checkout/update-status/{orderId}:
    put:
      tags:
        - Checkout & Orders
      summary: Update order status (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusDto'
      responses:
        '200':
          description: Status updated

  # =========================================================================
  # REVIEWS ENDPOINTS
  # =========================================================================
  /api/Reviews:
    get:
      tags:
        - Reviews
      summary: Get user's submitted reviews
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User reviews list

    post:
      tags:
        - Reviews
      summary: Create a product review
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewDto'
      responses:
        '200':
          description: Review created

  /api/Reviews/product/{productId}:
    get:
      tags:
        - Reviews
      summary: Get all reviews for a specific product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product reviews

  /api/Reviews/has-reviewed/{productId}:
    get:
      tags:
        - Reviews
      summary: Check if current user has reviewed a product
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Review status boolean result

  /api/Reviews/{reviewId}:
    put:
      tags:
        - Reviews
      summary: Update review content or rating
      security:
        - BearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewDto'
      responses:
        '200':
          description: Review updated

    delete:
      tags:
        - Reviews
      summary: Delete product review
      security:
        - BearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Review deleted

  # =========================================================================
  # WISHLIST ENDPOINTS
  # =========================================================================
  /api/Wishlist:
    get:
      tags:
        - Wishlist
      summary: Get user wishlist items
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User wishlist

    post:
      tags:
        - Wishlist
      summary: Add product to wishlist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToWishlistDto'
      responses:
        '200':
          description: Added to wishlist

  /api/Wishlist/count:
    get:
      tags:
        - Wishlist
      summary: Get count of wishlist items
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Count of wishlist items

  /api/Wishlist/check/{productId}:
    get:
      tags:
        - Wishlist
      summary: Check if product is in user wishlist
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Wishlist boolean status

  /api/Wishlist/{wishlistId}:
    delete:
      tags:
        - Wishlist
      summary: Remove item from wishlist by wishlist item ID
      security:
        - BearerAuth: []
      parameters:
        - name: wishlistId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item removed

  /api/Wishlist/product/{productId}:
    delete:
      tags:
        - Wishlist
      summary: Remove item from wishlist by product ID
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product removed from wishlist

  /api/Wishlist/clear-all:
    delete:
      tags:
        - Wishlist
      summary: Clear entire wishlist
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wishlist cleared

  # =========================================================================
  # USER PROFILE ENDPOINTS
  # =========================================================================
  /api/Users/profile:
    get:
      tags:
        - Users Profile
      summary: Get user profile details
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile details

    put:
      tags:
        - Users Profile
      summary: Update user profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: Profile updated

  /api/Users/upload-image:
    post:
      tags:
        - Users Profile
      summary: Upload user profile image
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profile image uploaded

  /api/Users/change-password:
    post:
      tags:
        - Users Profile
      summary: Change user password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '200':
          description: Password changed successfully

  # =========================================================================
  # SELLER DASHBOARD ENDPOINTS
  # =========================================================================
  /api/Seller/profile:
    get:
      tags:
        - Seller Management
      summary: Get seller profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Seller profile information

  /api/Seller/Updateprofile:
    put:
      tags:
        - Seller Management
      summary: Update seller profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSellerProfileDto'
      responses:
        '200':
          description: Seller profile updated

  /api/Seller/dashboard-stats:
    get:
      tags:
        - Seller Management
      summary: Get seller dashboard statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dashboard statistics

  # =========================================================================
  # PAYMENT ENDPOINTS (PayPal & Credit Card)
  # =========================================================================
  /api/PayPal/create:
    post:
      tags:
        - Payments
      summary: Create PayPal checkout payment link
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: PayPal payment approval URL created

  /api/PayPal/execute:
    get:
      tags:
        - Payments
      summary: Execute approved PayPal payment
      parameters:
        - name: paymentId
          in: query
          required: true
          schema:
            type: string
        - name: payerId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment executed successfully

  /api/PayPal/cancel:
    get:
      tags:
        - Payments
      summary: Cancel PayPal payment flow
      parameters:
        - name: paymentId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment cancellation acknowledged

  /api/CreditCard/process:
    post:
      tags:
        - Payments
      summary: Process Direct Credit Card Payment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardPaymentDto'
      responses:
        '200':
          description: Payment processing result

  # =========================================================================
  # ADMIN MANAGEMENT ENDPOINTS
  # =========================================================================
  /api/admin/users:
    get:
      tags:
        - Admin Management
      summary: Get list of all registered users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User list

  /api/admin/lock/{id}:
    post:
      tags:
        - Admin Management
      summary: Lock user account
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account locked

  /api/admin/unlock/{id}:
    post:
      tags:
        - Admin Management
      summary: Unlock user account
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account unlocked

  /api/admin/users/{id}:
    delete:
      tags:
        - Admin Management
      summary: Soft delete user account
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User soft deleted

  /api/admin/role:
    post:
      tags:
        - Admin Management
      summary: Change user role (Admin/Customer/Seller)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleDto'
      responses:
        '200':
          description: User role updated

  /api/admin/coupons:
    get:
      tags:
        - Admin Management
      summary: Get all coupons
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of coupons

    post:
      tags:
        - Admin Management
      summary: Create new discount coupon
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCouponDto'
      responses:
        '201':
          description: Coupon created

  /api/admin/coupons/{id}:
    delete:
      tags:
        - Admin Management
      summary: Delete a coupon
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Coupon deleted

  /api/admin/orders:
    get:
      tags:
        - Admin Management
      summary: Get all store orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of all orders

  /api/admin/orders/{id}/status:
    put:
      tags:
        - Admin Management
      summary: Update order status via query status string
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order status updated

  /api/admin/sellers/pending:
    get:
      tags:
        - Admin Management
      summary: Get pending seller applications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of pending sellers

  /api/admin/sellers:
    get:
      tags:
        - Admin Management
      summary: Get all sellers status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sellers status list

  /api/admin/sellers/{id}:
    get:
      tags:
        - Admin Management
      summary: Get details of a specific seller application
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Seller details

  /api/admin/sellers/{id}/approve:
    post:
      tags:
        - Admin Management
      summary: Approve a seller account
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Seller approved

  /api/admin/sellers/{id}/reject:
    post:
      tags:
        - Admin Management
      summary: Reject a seller account
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Seller rejected

  /api/admin/dashboard:
    get:
      tags:
        - Admin Management
      summary: Get Admin Dashboard Statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Admin dashboard metrics

